<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservation - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg hotel-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><i class="bi bi-building-fill-check"></i> GRAND HOTEL</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/search-rooms.html">Find Rooms</a></li>
                </ul>
                <div id="user-badge" class="d-flex align-items-center text-white"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="hotel-card">
                    <div class="card-header">
                        <span><i class="bi bi-calendar-check-fill text-warning me-2"></i> Confirm Room Reservation</span>
                        <span class="badge bg-primary">REST API JSON: POST /api/bookings</span>
                    </div>
                    <div class="card-body">

                        <form id="bookingForm">
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Customer ID</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="customerId" placeholder="e.g. 1" required>
                                        <a href="/pages/register.html" class="btn btn-outline-secondary btn-sm" target="_blank" title="Register new guest">New?</a>
                                    </div>
                                    <small class="text-muted">Enter registered ID or use 1 for demo guest.</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Room Selection</label>
                                    <input type="text" class="form-control bg-light" id="roomDisplay" readonly>
                                    <input type="hidden" id="roomId">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Check-In Date</label>
                                    <input type="date" class="form-control" id="checkInDate" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Check-Out Date</label>
                                    <input type="date" class="form-control" id="checkOutDate" required>
                                </div>
                            </div>

                            <!-- Cost Breakdown Box -->
                            <div class="p-3 bg-light border rounded mb-4">
                                <h6 class="fw-bold text-dark mb-3"><i class="bi bi-receipt me-1"></i> Booking Summary</h6>
                                <div class="d-flex justify-content-between mb-1 text-muted small">
                                    <span>Rate per night:</span>
                                    <span id="ratePerNight">₹0.00</span>
                                </div>
                                <div class="d-flex justify-content-between mb-1 text-muted small">
                                    <span>Total Duration:</span>
                                    <span id="stayNights">0 nights</span>
                                </div>
                                <div class="d-flex justify-content-between pt-2 border-top fw-bold text-dark fs-5">
                                    <span>Total Estimated Amount:</span>
                                    <span id="totalCost" class="text-success">₹0.00</span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-hotel-gold w-100 py-2 fs-5" id="confirmBtn">
                                <i class="bi bi-shield-lock-fill me-2"></i> Confirm Booking & Proceed to Payment
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('roomId');
        const roomNo = params.get('roomNo');
        const price = parseFloat(params.get('price') || 2500);
        const checkIn = params.get('checkIn');
        const checkOut = params.get('checkOut');

        document.getElementById('roomId').value = roomId || 1;
        document.getElementById('roomDisplay').value = `Room ${roomNo || '101'} (₹${price}/night)`;
        document.getElementById('checkInDate').value = checkIn || '';
        document.getElementById('checkOutDate').value = checkOut || '';

        // If customer ID is in session, fill it
        const savedCustId = sessionStorage.getItem('current_customer_id');
        if (savedCustId) {
            document.getElementById('customerId').value = savedCustId;
        }

        function calculateCost() {
            const cin = new Date(document.getElementById('checkInDate').value);
            const cout = new Date(document.getElementById('checkOutDate').value);

            if (!isNaN(cin.getTime()) && !isNaN(cout.getTime()) && cout > cin) {
                const diffTime = Math.abs(cout - cin);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const total = diffDays * price;

                document.getElementById('ratePerNight').textContent = `₹${price.toFixed(2)}`;
                document.getElementById('stayNights').textContent = `${diffDays} night(s)`;
                document.getElementById('totalCost').textContent = `₹${total.toFixed(2)}`;
                return total;
            } else {
                document.getElementById('ratePerNight').textContent = `₹${price.toFixed(2)}`;
                document.getElementById('stayNights').textContent = `0 nights`;
                document.getElementById('totalCost').textContent = `₹0.00`;
                return 0;
            }
        }

        document.getElementById('checkInDate').addEventListener('change', calculateCost);
        document.getElementById('checkOutDate').addEventListener('change', calculateCost);
        calculateCost();

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Reservation...`;

            const custId = document.getElementById('customerId').value;
            const rId = document.getElementById('roomId').value;
            const cin = document.getElementById('checkInDate').value;
            const cout = document.getElementById('checkOutDate').value;

            try {
                const res = await createBooking({
                    customerId: parseInt(custId),
                    roomId: parseInt(rId),
                    checkInDate: cin,
                    checkOutDate: cout
                });

                showToast('Booking created! Redirecting to payment...', 'success');
                const booking = res.data;
                setTimeout(() => {
                    window.location.href = `/pages/payment.html?bookingId=${booking.id}&bookingCode=${booking.bookingId}&customerId=${custId}&amount=${booking.totalCost}`;
                }, 1000);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-shield-lock-fill me-2"></i> Confirm Booking & Proceed to Payment`;
                showToast(err.message || 'Booking failed', 'danger');
            }
        });
    </script>
</body>
</html>
