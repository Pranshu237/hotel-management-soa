<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(135deg, var(--navy-dark), var(--navy));">

    <div class="card shadow-lg p-4" style="max-width: 420px; width: 100%; border-radius: 12px; border-top: 4px solid var(--gold);">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: var(--navy)"><i class="bi bi-building-fill-check text-warning"></i> Grand Hotel</h3>
            <p class="text-muted small">Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold small">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="e.g. admin or receptionist" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-hotel-primary w-100 py-2 mb-3">Sign In</button>
        </form>

        <div class="alert alert-info py-2 small mb-3">
            <strong>Demo Credentials:</strong><br>
            • Admin: <code>admin</code> / <code>admin123</code><br>
            • Receptionist: <code>receptionist</code> / <code>recep123</code>
        </div>

        <div class="text-center">
            <a href="/pages/register.html" class="text-decoration-none small text-muted">New customer? Register via SOAP</a>
            <br>
            <a href="/index.html" class="text-decoration-none small text-muted">← Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            try {
                const user = await loginUser(u, p);
                setCurrentUser(user);
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    if (user.role === 'ADMIN' || user.role === 'RECEPTIONIST') {
                        window.location.href = '/pages/admin/dashboard.html';
                    } else {
                        window.location.href = '/pages/my-bookings.html';
                    }
                }, 1000);
            } catch (err) {
                showToast(err.message || 'Login failed', 'danger');
            }
        });
    </script>
</body>
</html>
