<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg hotel-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><i class="bi bi-building-fill-check"></i> GRAND HOTEL</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/search-rooms.html">Find Rooms</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pages/my-bookings.html">My Bookings</a></li>
                </ul>
                <div id="user-badge" class="d-flex align-items-center text-white"></div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold" style="color: var(--navy)"><i class="bi bi-journal-bookmark-fill me-2"></i>My Bookings</h3>
                <p class="text-muted small mb-0">View booking status, cancel reservations, or proceed to payment</p>
            </div>
            <div class="d-flex gap-2">
                <div class="input-group" style="width: 250px;">
                    <span class="input-group-text small">Customer ID</span>
                    <input type="number" class="form-control" id="searchCustId" value="1">
                    <button class="btn btn-hotel-primary" onclick="loadMyBookings()"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="hotel-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Booking Code</th>
                                <th>Room Number</th>
                                <th>Stay Dates</th>
                                <th>Total Cost</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading reservations...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        const savedId = sessionStorage.getItem('current_customer_id');
        if (savedId) {
            document.getElementById('searchCustId').value = savedId;
        }

        async function loadMyBookings() {
            const custId = document.getElementById('searchCustId').value;
            const tbody = document.getElementById('bookingsTableBody');

            try {
                const list = await getCustomerBookings(custId);
                if (!list || list.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No bookings found for Customer ID #${custId}.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = list.map(b => {
                    const statusClass = `badge-${b.status.toLowerCase()}`;
                    return `
                        <tr>
                            <td class="fw-bold text-primary font-monospace">${b.bookingId}</td>
                            <td>
                                <strong>Room ${b.room ? b.room.roomNumber : 'N/A'}</strong>
                                <span class="text-muted small d-block">${b.room && b.room.roomType ? b.room.roomType.name : ''}</span>
                            </td>
                            <td>
                                <div><small class="text-muted">In:</small> ${b.checkInDate}</div>
                                <div><small class="text-muted">Out:</small> ${b.checkOutDate}</div>
                            </td>
                            <td class="fw-bold text-success">₹${b.totalCost}</td>
                            <td><span class="badge badge-status ${statusClass}">${b.status}</span></td>
                            <td class="text-end">
                                ${b.status === 'CONFIRMED' ? `
                                    <a href="/pages/payment.html?bookingId=${b.id}&customerId=${custId}&amount=${b.totalCost}" class="btn btn-sm btn-outline-success me-1">
                                        <i class="bi bi-credit-card"></i> Pay (SOAP)
                                    </a>
                                    <button class="btn btn-sm btn-outline-danger" onclick="cancelCustBooking(${b.id})">
                                        <i class="bi bi-x-circle"></i> Cancel
                                    </button>
                                ` : ''}
                                <a href="/pages/booking-confirmation.html?bookingId=${b.id}" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-receipt"></i> Details
                                </a>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error loading bookings: ${err.message}</td></tr>`;
            }
        }

        async function cancelCustBooking(id) {
            if (!confirm('Are you sure you want to cancel this booking?')) return;
            try {
                await cancelBooking(id);
                showToast('Booking cancelled successfully', 'warning');
                loadMyBookings();
            } catch (err) {
                showToast(err.message || 'Failed to cancel', 'danger');
            }
        }

        loadMyBookings();
    </script>
</body>
</html>
